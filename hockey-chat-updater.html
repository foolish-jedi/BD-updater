<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hockey Updater">
  <title>Hockey Chat Updater</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #172136;
      --card-border: #233352;
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #2563eb;
      --blue-glow: #3b82f6;
      --gold: #d97706;
      --green: #16a34a;
      --red: #dc2626;
      --cyan: #06b6d4;
      --purple: #9333ea;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 10px 10px 80px 10px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Scoreboard */
    .scoreboard {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      text-align: center;
    }
    .team-input {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      border-radius: 6px;
      padding: 4px;
      width: 100%;
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }
    .score-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #25334d;
      color: #fff;
      border: 1px solid var(--card-border);
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .score-btn:active { background: #3b82f6; }
    .score-num { font-size: 30px; font-weight: 800; min-width: 32px; font-variant-numeric: tabular-nums; }

    /* Game Type & Tourney Banner */
    .game-type-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .game-type-bar::-webkit-scrollbar { display: none; }
    .game-type-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .game-type-select {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: #fde047;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      padding: 4px 6px;
      flex-shrink: 0;
    }
    .tourney-name-input {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      padding: 4px 8px;
      flex-grow: 1;
      min-width: 120px;
    }

    /* Period & Time Status Bar */
    .period-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      margin-top: 8px;
      padding-top: 8px;
      padding-bottom: 2px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .period-bar::-webkit-scrollbar { display: none; }
    .period-select {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: #38bdf8;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 8px;
      flex-shrink: 0;
    }
    .status-btn {
      background: #25334d;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-btn:active { background: var(--blue); }

    /* Time Context Chips */
    .time-chips-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-top: 6px;
      padding-top: 4px;
      scrollbar-width: none;
    }
    .time-chips-bar::-webkit-scrollbar { display: none; }
    .time-chip {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .time-chip.active {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #bfdbfe;
    }

    /* Sticky Output Box */
    .output-box {
      background: #080d1a;
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 10px;
      position: sticky;
      top: 6px;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .header-toggles {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mode-toggle {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #93c5fd;
      cursor: pointer;
    }
    .mode-toggle.announcer-toggle {
      color: #facc15;
      font-weight: 700;
    }
    .btn-clear-output {
      background: #25334d;
      border: 1px solid var(--card-border);
      color: #94a3b8;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.1s;
    }
    .btn-clear-output:active {
      background: #334155;
      color: #fff;
    }
    .output-text {
      width: 100%;
      min-height: 56px;
      background: #151e30;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14.5px;
      line-height: 1.35;
      padding: 8px;
      resize: none;
      overflow-y: hidden;
      box-sizing: border-box;
      transition: height 0.15s ease-out;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 2fr 1.8fr 1fr 1fr;
      gap: 5px;
      margin-top: 6px;
    }
    .btn-action {
      padding: 9px 4px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      color: #fff;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-share { background: linear-gradient(180deg, #16a34a 0%, #15803d 100%); }
    .btn-copy { background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%); }
    .btn-rephrase { background: #334155; }
    .btn-undo { background: #475569; }

    /* Number Selector Card */
    .section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 10px;
    }
    .sec-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .player-indicator-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .player-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tag-primary {
      background: #1e3a8a;
      border: 1px solid #3b82f6;
      color: #bfdbfe;
    }
    .tag-assist {
      background: #78350f;
      border: 1px solid #d97706;
      color: #fde68a;
    }
    .tag-clear {
      font-size: 13px;
      cursor: pointer;
      opacity: 0.8;
    }

    .num-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .num-btn {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
    }
    .num-btn:active { transform: scale(0.95); }
    .num-btn .goal-counter-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ea580c;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      border-radius: 8px;
      min-width: 16px;
      height: 16px;
      padding: 0 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #0b1120;
      box-shadow: 0 0 6px rgba(234, 88, 12, 0.8);
      pointer-events: none;
    }
    .num-btn .goal-counter-badge.hat-trick {
      background: #eab308;
      color: #713f12;
      box-shadow: 0 0 8px rgba(234, 179, 8, 1);
    }
    .num-btn.active-primary {
      background: var(--blue);
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.6);
    }
    .num-btn.active-assist {
      background: var(--gold);
      border-color: #fbbf24;
      color: #fff;
      box-shadow: 0 0 8px rgba(217, 119, 6, 0.6);
    }
    .num-btn.goalie {
      border-color: #06b6d4;
      color: #a5f3fc;
      background: #042f2e;
    }
    .num-btn.goalie.active-primary {
      background: #0891b2;
      border-color: #67e8f9;
      color: #fff;
    }

    .custom-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .custom-row input {
      width: 70px;
      background: #0b1222;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      text-align: center;
      padding: 5px;
      font-size: 13px;
    }
    .custom-row button {
      background: #25334d;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Play Categories */
    .cat-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-bottom: 8px;
      scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #0b1222;
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: #60a5fa;
    }

    /* Play Action Buttons */
    .play-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .play-btn {
      background: #0b1222;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px 11px;
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .play-btn:active { background: #25334d; }
    .play-btn.goal { border-color: var(--gold); }
    .play-btn.opp { border-color: var(--red); }
    .badge-add {
      font-size: 11px;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #94a3b8;
    }

    /* Reset Game Footer */
    .footer-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 8px 4px;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- SCOREBOARD -->
  <div class="scoreboard">
    <!-- Tournament / Game Context Banner -->
    <div class="game-type-bar">
      <span class="game-type-label">🏆 Game:</span>
      <select id="gameTypeSelect" class="game-type-select" onchange="saveGameState()">
        <option value="">League / Regular</option>
        <option value="Round Robin">Round Robin</option>
        <option value="Round Robin Game 1">RR Game 1</option>
        <option value="Round Robin Game 2">RR Game 2</option>
        <option value="Round Robin Game 3">RR Game 3</option>
        <option value="Quarter-Final">Quarter-Final</option>
        <option value="Semi-Final">Semi-Final</option>
        <option value="Championship Final">🏆 Championship Final</option>
        <option value="Exhibition">Exhibition</option>
      </select>
      <input type="text" id="tourneyNameInput" class="tourney-name-input" placeholder="Tournament Name (opt.)" oninput="saveGameState()">
    </div>

    <div>
      <input type="text" id="ourTeam" class="team-input" value="Bulldogs" oninput="saveGameState()">
      <div class="score-row">
        <button class="score-btn" onclick="adjScore('our', -1)">−</button>
        <span id="ourScore" class="score-num">0</span>
        <button class="score-btn" onclick="adjScore('our', 1)">+</button>
      </div>
    </div>
    <div style="font-weight: bold; color: var(--muted); font-size: 13px;">VS</div>
    <div>
      <input type="text" id="oppTeam" class="team-input" value="Hawks" oninput="saveGameState()">
      <div class="score-row">
        <button class="score-btn" onclick="adjScore('opp', -1)">−</button>
        <span id="oppScore" class="score-num">0</span>
        <button class="score-btn" onclick="adjScore('opp', 1)">+</button>
      </div>
    </div>

    <!-- Period & Status Bar -->
    <div class="period-bar">
      <select id="periodSelect" class="period-select" onchange="saveGameState()">
        <option value="1st">1st Period</option>
        <option value="2nd">2nd Period</option>
        <option value="3rd">3rd Period</option>
        <option value="OT">Overtime</option>
        <option value="Final">Final</option>
      </select>
      <button class="status-btn" onclick="periodStatus('warmup')">🏒 Warmup</button>
      <button class="status-btn" onclick="periodStatus('puck-drop')">🏁 Puck Drop</button>
      <button class="status-btn" onclick="periodStatus('period-end')">⏸ Period End</button>
      <button class="status-btn" onclick="periodStatus('game-final')">🏆 Game Final</button>
    </div>

    <!-- Time Context Tags -->
    <div class="time-chips-bar">
      <span style="font-size: 10px; font-weight: bold; color: var(--muted); align-self: center; margin-right: 2px;">TIME:</span>
      <button class="time-chip active" id="chip-time-none" onclick="setTimeTag('')">None</button>
      <button class="time-chip" id="chip-time-early" onclick="setTimeTag('Early')">Early</button>
      <button class="time-chip" id="chip-time-mid" onclick="setTimeTag('Mid')">Mid</button>
      <button class="time-chip" id="chip-time-late" onclick="setTimeTag('Late in the period')">Late</button>
      <button class="time-chip" id="chip-time-under2" onclick="setTimeTag('Under 2 mins left')">&lt; 2 Mins</button>
      <button class="time-chip" id="chip-time-finalmin" onclick="setTimeTag('Final minute')">Final Min</button>
    </div>
  </div>

  <!-- STICKY OUTPUT & MULTI-STEP BUILDER -->
  <div class="output-box">
    <div class="output-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size: 11px; font-weight: bold; color: #93c5fd;" id="statusLabel">MESSAGE PREVIEW</span>
        <button type="button" class="btn-clear-output" onclick="clearOutput()" title="Clear text box">✕ Clear</button>
      </div>
      <div class="header-toggles">
        <label class="mode-toggle announcer-toggle">
          <input type="checkbox" id="announcerToggle" checked onchange="saveGameState()">
          <span>🎙️ Play-by-Play</span>
        </label>
        <label class="mode-toggle">
          <input type="checkbox" id="multiStepToggle" checked onchange="saveGameState()">
          <span>Multi-Step</span>
        </label>
      </div>
    </div>
    <textarea id="output" class="output-text" placeholder="Select player # then tap play..." oninput="autoResizeTextarea(); saveGameState()"></textarea>
    <div class="btn-row">
      <button id="shareBtn" class="btn-action btn-share" onclick="shareNative()">📤 Share</button>
      <button id="copyBtn" class="btn-action btn-copy" onclick="copyText()">📋 Copy</button>
      <button class="btn-action btn-rephrase" onclick="rephrase()">🔄 Rephrase</button>
      <button class="btn-action btn-undo" onclick="undoLastAction()">↩ Undo</button>
    </div>
  </div>

  <!-- PLAYER SELECTOR -->
  <div class="section">
    <div class="sec-title">
      <span>1. Select Player (Tap 1st = Primary • Tap 2nd = Assist)</span>
      <span style="cursor:pointer; color:#93c5fd;" onclick="clearPlayers()">Clear All</span>
    </div>

    <!-- Active Indicators -->
    <div class="player-indicator-row">
      <div id="badgePrimary" class="player-tag tag-primary" style="display:none;">
        <span>Player: <strong id="lblPrimary">#0</strong></span>
        <span class="tag-clear" onclick="setPrimary(null)">✕</span>
      </div>
      <div id="badgeAssist" class="player-tag tag-assist" style="display:none;">
        <span>Assist: <strong id="lblAssist">#0</strong></span>
        <span class="tag-clear" onclick="setAssist(null)">✕</span>
      </div>
    </div>

    <!-- Roster Grid (Hardcoded HTML so it NEVER disappears in Quick Look or offline) -->
    <div class="num-grid" id="numGrid">
      <button class="num-btn" id="pbtn-2" onclick="onPlayerTap(2)">#2</button>
      <button class="num-btn" id="pbtn-6" onclick="onPlayerTap(6)">#6</button>
      <button class="num-btn" id="pbtn-7" onclick="onPlayerTap(7)">#7</button>
      <button class="num-btn" id="pbtn-8" onclick="onPlayerTap(8)">#8</button>
      <button class="num-btn" id="pbtn-10" onclick="onPlayerTap(10)">#10</button>
      <button class="num-btn" id="pbtn-16" onclick="onPlayerTap(16)">#16</button>
      <button class="num-btn" id="pbtn-18" onclick="onPlayerTap(18)">#18</button>
      <button class="num-btn" id="pbtn-22" onclick="onPlayerTap(22)">#22</button>
      <button class="num-btn" id="pbtn-23" onclick="onPlayerTap(23)">#23</button>
      <button class="num-btn" id="pbtn-24" onclick="onPlayerTap(24)">#24</button>
      <button class="num-btn" id="pbtn-27" onclick="onPlayerTap(27)">#27</button>
      <button class="num-btn" id="pbtn-72" onclick="onPlayerTap(72)">#72</button>
      <button class="num-btn" id="pbtn-93" onclick="onPlayerTap(93)">#93</button>
      <button class="num-btn" id="pbtn-97" onclick="onPlayerTap(97)">#97</button>
      <button class="num-btn goalie" id="pbtn-29" onclick="onPlayerTap(29)" title="Goalie #29">🧤#29</button>
      <button class="num-btn goalie" id="pbtn-74" onclick="onPlayerTap(74)" title="Goalie #74">🧤#74</button>
    </div>

    <!-- Custom Number Input -->
    <div class="custom-row">
      <input type="number" id="customNum" placeholder="# custom">
      <button onclick="setCustom('primary')">+ Set Player</button>
      <button onclick="setCustom('assist')">+ Set Assist</button>
      <button style="margin-left:auto;" onclick="clearPlayers()">Clear #</button>
    </div>
  </div>

  <!-- PLAY CATEGORY TABS & BUTTONS -->
  <div class="section">
    <div class="sec-title">2. Choose Play / Action</div>
    
    <div class="cat-tabs">
      <button class="cat-btn active" onclick="showTab('setup', this)">🏒 1. Setup / Moves</button>
      <button class="cat-btn" onclick="showTab('finish', this)">🚨 2. Goals / Finish</button>
      <button class="cat-btn" onclick="showTab('hustle', this)">💪 Hustle & Grind</button>
      <button class="cat-btn" onclick="showTab('penalties', this)">⚡ Penalties</button>
      <button class="cat-btn" onclick="showTab('defense', this)">🛡️ Defense</button>
      <button class="cat-btn" onclick="showTab('goalie', this)">🧤 Goalie</button>
      <button class="cat-btn" onclick="showTab('opp', this)">🔴 Opponent</button>
    </div>

    <!-- TAB 1: SETUPS & PASSES -->
    <div id="tab-setup" class="play-grid">
      <button class="play-btn" onclick="applyPlay('setup-coast-to-coast')">
        <span>⚡ Coast-to-coast end-to-end rush</span>
        <span class="badge-add">+ Step</span>
      </button>
      <button class="play-btn" onclick="applyPlay('setup-point-hold')">
        <span>📌 Keeps puck in at the point</span>
        <span class="badge-add">+ Step</span>
      </button>
      <button class="play-btn" onclick="applyPlay('setup-cross-crease')">
        <span>⚡ Cross-crease pass</span>
        <span class="badge-add">+ Step</span>
      </button>
      <button class="play-btn" onclick="applyPlay('setup-down-wing')">
        <span>💨 Wheels down the wing</span>
        <span class="badge-add">+ Step</span>
      </button>
      <button class="play-btn" onclick="applyPlay('setup-toe-drag')">
        <span>🪄 Silky toe-drag past D</span>
        <span class="badge-add">+ Step</span>
      </button>

          : `🏁 That's the game! Final result: ${sc}. Great effort out there today!`,
        (per, our, opp, sc, os, ops) => (os !== undefined && ops !== undefined && os > ops)
          ? `🏆 THAT'LL DO IT! ${our} secure the ${sc} victory! Parents on their feet!`
          : `🏁 Buzzer sounds to end the contest: ${sc}! On to the next one!`,
        (per, our, opp, sc, os, ops) => `🏆 Final score in the books: ${sc}! Fantastic hockey from both sides today!`,
        (per, our, opp, sc, os, ops) => `🏆 Game over! Final score: ${sc}! What a game to watch!`,
        (per, our, opp, sc, os, ops) => `🏆 That wraps up today's contest! Final result: ${sc}!`
      ]
    };

    // Announcer Flavor Packs for Goals & Highlights
    const announcerIntros = [
      "HE SHOOTS, HE SCORES! ",
      "LIGHT THE LAMP! ",
      "OH BABY! WHAT A PLAY! ",
      "MERCY! ",
      "CAN YOU BELIEVE IT?! ",
      "BAR DOWN AND IN! ",
      "FIRE UP THE SIREN! ",
      "WHAT A RIP! ",
      "SWEET MOTHER OF HOCKEY! ",
      "TEXTBOOK CLINIC! ",
      "UNBELIEVABLE MOVE! ",
      "HEADING TO THE HIGHLIGHT REEL! ",
      "ARE YOU KIDDING ME?! ",
      "GREAT SCOT! WHAT A GOAL! ",
      "RIGHT ON THE TAPE AND IN! ",
      "DOWN WENT THE GOALIE! ",
      "TOP CORNER PURE SNIPE! ",
      "THAT WILL WAKE UP THE WHOLE ARENA! "
    ];

    const announcerOutros = [
      " Pure hockey poetry!",
      " Goalie is still looking for that one!",
      " You could hear that ping all the way out in the parking lot!",
      " Top shelf where grand-pappy keeps the moonshine!",
      " Put that one on the highlight reel!",
      " Water bottle went into orbit!",
      " Unstoppable venom on that shot!",
      " The barn is rocking!",
      " That one had eyes through traffic!",
      " Absolute clinic on display today!",
      " You cannot stop that with two goaltenders!",
      " Smooth as silk from start to finish!",
      " Total silence on the opponent's bench!",
      " Parents on their feet cheering!",
      " Clean as a whistle!",
      " What an absolute gem of a goal!"
    ];

    // Load & Render on Start
    function initApp() {
      try {
        loadGameState();
      } catch (e) {
        console.warn('GameState load skipped:', e);
      }
      try {
        updatePlayerBadges();
        autoResizeTextarea();
      } catch (e) {}
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    window.onload = initApp;

    function autoResizeTextarea() {
      const box = document.getElementById('output');
      if (!box) return;
      box.style.height = 'auto';
      box.style.height = Math.max(56, box.scrollHeight) + 'px';
    }

    function clearOutput() {
      pushUndoState();
      document.getElementById('output').value = '';
      currentSteps = [];
      lastKey = null;
      autoResizeTextarea();
      saveGameState();
    }

    function onPlayerTap(num) {
      if (primaryPlayer === num) {
        setPrimary(null);
      } else if (assistPlayer === num) {
        setAssist(null);
      } else if (!primaryPlayer) {
        setPrimary(num);
      } else if (!assistPlayer) {
        setAssist(num);
      } else {
        // Both full, cycle primary
        setPrimary(num);
      }
    }

    function setPrimary(num) {
      primaryPlayer = num;
      updatePlayerBadges();
      saveGameState();
    }

    function setAssist(num) {
      assistPlayer = num;
      updatePlayerBadges();
      saveGameState();
    }

    function clearPlayers() {
      primaryPlayer = null;
      assistPlayer = null;
      document.getElementById('customNum').value = '';
      updatePlayerBadges();
      saveGameState();
    }

    function setCustom(target) {
      const val = parseInt(document.getElementById('customNum').value, 10);
      if (!val) return;
      if (target === 'primary') setPrimary(val);
      else setAssist(val);
      document.getElementById('customNum').value = '';
    }

    function updatePlayerBadges() {
      const bPrim = document.getElementById('badgePrimary');
      const bAsst = document.getElementById('badgeAssist');
      if (primaryPlayer) {
        document.getElementById('lblPrimary').textContent = '#' + primaryPlayer;
        bPrim.style.display = 'flex';
      } else {
        bPrim.style.display = 'none';
      }
      if (assistPlayer) {
        document.getElementById('lblAssist').textContent = '#' + assistPlayer;
        bAsst.style.display = 'flex';
      } else {
        bAsst.style.display = 'none';
      }

      // Update button highlight classes and goal counter badges
      document.querySelectorAll('.num-btn').forEach(btn => {
        const raw = parseInt(btn.id.replace('pbtn-', ''), 10);
        btn.classList.toggle('active-primary', raw === primaryPlayer);
        btn.classList.toggle('active-assist', raw === assistPlayer);

        // Remove old badge if any
        const oldBadge = btn.querySelector('.goal-counter-badge');
        if (oldBadge) oldBadge.remove();

        const count = playerGoals[raw] || 0;
        if (count > 0) {
          const badge = document.createElement('span');
          badge.className = 'goal-counter-badge' + (count >= 3 ? ' hat-trick' : '');
          badge.textContent = count >= 3 ? '🎩' + count : count;
          btn.appendChild(badge);
        }
      });
    }

    // Time Tagging
    function setTimeTag(tag) {
      currentTimeTag = tag;
      document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
      if (!tag) {
        document.getElementById('chip-time-none').classList.add('active');
      } else if (tag === 'Early') {
        document.getElementById('chip-time-early').classList.add('active');
      } else if (tag === 'Mid') {
        document.getElementById('chip-time-mid').classList.add('active');
      } else if (tag.includes('Late')) {
        document.getElementById('chip-time-late').classList.add('active');
      } else if (tag.includes('Under 2')) {
        document.getElementById('chip-time-under2').classList.add('active');
      } else {
        document.getElementById('chip-time-finalmin').classList.add('active');
      }
    }

    function adjScore(team, d) {
      pushUndoState();
      if (team === 'our') ourScore = Math.max(0, ourScore + d);
      else oppScore = Math.max(0, oppScore + d);
      document.getElementById('ourScore').textContent = ourScore;
      document.getElementById('oppScore').textContent = oppScore;
      saveGameState();
    }

    function getScoreText() {
      const our = document.getElementById('ourTeam').value.trim() || 'Bulldogs';
      const opp = document.getElementById('oppTeam').value.trim() || 'Hawks';
      if (ourScore === oppScore) return `Tied ${ourScore}-${oppScore}`;
      if (ourScore > oppScore) return `${ourScore}-${oppScore} ${our}`;
      return `${oppScore}-${ourScore} ${opp}`;
    }

    function showTab(id, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['setup', 'finish', 'hustle', 'penalties', 'defense', 'goalie', 'opp'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        if (el) el.style.display = (t === id) ? 'grid' : 'none';
      });
    }

    // Check if the current goal is high-leverage / clutch for "Holy Mackinaw"
    function isClutchGoal() {
      const per = document.getElementById('periodSelect').value;
      // 1. Any Overtime goal (Golden goal / game winner!)
      if (per === 'OT') return true;
      // 2. Go-ahead goal (breaks a tie to take the lead)
      if (ourScore === oppScore + 1) return true;
      // 3. Late 3rd period in a tight game (within 1 goal)
      const isLate3rd = (per === '3rd' || per === 'Final') && 
        (currentTimeTag.includes('Late') || currentTimeTag.includes('Under 2') || currentTimeTag.includes('Final'));
      const isTightScore = Math.abs(ourScore - oppScore) <= 1;
      if (isLate3rd && isTightScore) return true;

      return false;
    }

    // Action Execution
    function applyPlay(key) {
      pushUndoState();

      if (key.startsWith('goal-')) {
        ourScore = Math.max(0, ourScore + 1);
        document.getElementById('ourScore').textContent = ourScore;
      }
      if (key.startsWith('opp-goal') || key === 'opp-scramble') {
        oppScore = Math.max(0, oppScore + 1);
        document.getElementById('oppScore').textContent = oppScore;
      }

      lastKey = key;
      lastVarIndex = Math.floor(Math.random() * phrases[key].length);

      const isMulti = document.getElementById('multiStepToggle').checked;
      const isAnnouncer = document.getElementById('announcerToggle').checked;
      const box = document.getElementById('output');

      if (!isMulti || box.value.trim().length === 0) {
        currentSteps = [];
      }

      const prevStep = (isMulti && currentSteps.length > 0) ? currentSteps[currentSteps.length - 1] : null;
      let thisPrimary = primaryPlayer;
      let thisAssist = assistPlayer;
      let isSameAsPrev = false;

      // Smart Carry-Over: if multi-step and user didn't tap a new number, inherit the player from step 1!
      if (isMulti && prevStep && thisPrimary === null && prevStep.primary) {
        thisPrimary = prevStep.primary;
        isSameAsPrev = true;
      } else if (isMulti && prevStep && thisPrimary !== null && prevStep.primary === thisPrimary) {
        isSameAsPrev = true;
      }

      // Track individual player goal count
      let goalCount = 0;
      if (key.startsWith('goal-') && thisPrimary) {
        playerGoals[thisPrimary] = (playerGoals[thisPrimary] || 0) + 1;
        goalCount = playerGoals[thisPrimary];
        updatePlayerBadges();
      }

      const phrase = getPhrase(key, lastVarIndex, thisPrimary, thisAssist);

      let prefix = '';
      if (currentTimeTag && (!isMulti || currentSteps.length === 0)) {
        const per = document.getElementById('periodSelect').value;
        prefix = `[${currentTimeTag} ${per}] `;
      }

      let styledPhrase = phrase;
      if (key.startsWith('goal-')) {
        // Milestone Celebrations (Hat Trick / 2nd of the game / 4th goal)
        if (goalCount === 3) {
          styledPhrase = phrase + ` 🎩 HAT TRICK ALERT!! That's 3 on the day for #${thisPrimary}! Throw the hats on the ice!!`;
        } else if (goalCount === 2) {
          styledPhrase = phrase + ` That's a pair on the day for #${thisPrimary}!`;
        } else if (goalCount >= 4) {
          styledPhrase = phrase + ` Incredible! That's goal #${goalCount} today for #${thisPrimary}! Unstoppable!!`;
        }

        if (isAnnouncer) {
          const clutch = isClutchGoal();
          const useHolyMackinaw = clutch && (Math.random() < 0.35);

          if (useHolyMackinaw) {
            if (!isMulti || currentSteps.length === 0) {
              let clean = styledPhrase.replace(/^and\s+/i, '');
              styledPhrase = "HOLY MACKINAW!! " + clean.charAt(0).toUpperCase() + clean.slice(1);
            } else {
              styledPhrase = styledPhrase.replace(/^and\s+/i, 'and HOLY MACKINAW, ');
            }
          } else {
            const intro = announcerIntros[Math.floor(Math.random() * announcerIntros.length)];
            const outro = announcerOutros[Math.floor(Math.random() * announcerOutros.length)];
            if (!isMulti || currentSteps.length === 0) {
              let clean = styledPhrase.replace(/^and\s+/i, '');
              styledPhrase = intro + clean.charAt(0).toUpperCase() + clean.slice(1) + outro;
            }
          }
        }
      }

      // If same player as previous step, smoothly connect: replace "and #7 " with "and "
      if (isMulti && currentSteps.length > 0 && isSameAsPrev && thisPrimary) {
        styledPhrase = styledPhrase.replace(new RegExp('^and\\s+#' + thisPrimary + '\\s+', 'i'), 'and ');
      }

      const stepObj = {
        key: key,
        varIndex: lastVarIndex,
        primary: thisPrimary,
        assist: thisAssist,
        isSameAsPrev: isSameAsPrev,
        goalCount: goalCount,
        isPeriodStatus: false,
        text: (isMulti && currentSteps.length > 0) ? styledPhrase : (prefix + styledPhrase.charAt(0).toUpperCase() + styledPhrase.slice(1))
      };

      if (isMulti && currentSteps.length > 0) {
        currentSteps.push(stepObj);
      } else {
        currentSteps = [stepObj];
      }

      box.value = currentSteps.map(s => s.text).join(', ');
      autoResizeTextarea();

      // Auto-clear player selection after applying a play in multi-step mode
      // so the next selected player immediately becomes the actor for the next step!
      if (isMulti) {
        primaryPlayer = null;
        assistPlayer = null;
        updatePlayerBadges();
      }

      saveGameState();
    }

    function getPhrase(key, idx, pOverride, aOverride) {
      const pVal = (pOverride !== undefined) ? pOverride : primaryPlayer;
      const aVal = (aOverride !== undefined) ? aOverride : assistPlayer;
      const p = pVal ? `#${pVal}` : (document.getElementById('ourTeam').value || 'Bulldogs');
      const a = aVal ? `#${aVal}` : null;
      const opp = document.getElementById('oppTeam').value || 'Hawks';
      const score = getScoreText();
      const list = phrases[key];
      const fn = list[idx % list.length];
      if (key.startsWith('opp-')) return fn(opp, null, score);

      if (key.startsWith('goalie-change-')) {
        let gIn = '#74';
        let gOut = '#29';
        if (pVal === 29) {
          gIn = '#29';
          gOut = '#74';
        } else if (pVal === 74) {
          gIn = '#74';
          gOut = '#29';
        } else if (pVal && aVal) {
          gIn = `#${pVal}`;
          gOut = `#${aVal}`;
        }
        return fn(p, a, score, gIn, gOut);
      }

      return fn(p, a, score);
    }

    // Rephrase
    function rephrase() {
      if (currentSteps.length === 0) {
        if (!lastKey || !phrases[lastKey]) return;
      }

      // Check if it was a period status
      if (currentSteps.length === 1 && currentSteps[0].isPeriodStatus) {
        const step = currentSteps[0];
        const per = document.getElementById('periodSelect').value;
        const our = document.getElementById('ourTeam').value.trim() || 'Bulldogs';
        const opp = document.getElementById('oppTeam').value.trim() || 'Hawks';
        const sc = getScoreText();
        const gameType = document.getElementById('gameTypeSelect').value;
        const tourney = document.getElementById('tourneyNameInput').value.trim();
        let tourneyPrefix = '';
        if (tourney && gameType) tourneyPrefix = `[${tourney} - ${gameType}] `;
        else if (tourney) tourneyPrefix = `[${tourney}] `;
        else if (gameType) tourneyPrefix = `[${gameType}] `;

        const list = periodStatusPhrases[step.key];
        step.varIndex = (step.varIndex + 1) % list.length;
        step.text = tourneyPrefix + list[step.varIndex](per, our, opp, sc, ourScore, oppScore);
        document.getElementById('output').value = step.text;
        autoResizeTextarea();
        saveGameState();
        return;
      }

      const isMulti = document.getElementById('multiStepToggle').checked;
      const isAnnouncer = document.getElementById('announcerToggle').checked;
      const box = document.getElementById('output');

      if (currentSteps.length > 0) {
        // Rephrase every step in the multi-step sequence together!
        currentSteps.forEach((step, sIdx) => {
          if (!step || !phrases[step.key]) return;
          step.varIndex = (step.varIndex + 1) % phrases[step.key].length;
          const newRaw = getPhrase(step.key, step.varIndex, step.primary, step.assist);
          let styled = newRaw;

          const isSame = step.isSameAsPrev || (sIdx > 0 && currentSteps[sIdx - 1].primary && currentSteps[sIdx - 1].primary === step.primary);

          if (step.key.startsWith('goal-')) {
            if (step.goalCount === 3) {
              styled += ` 🎩 HAT TRICK ALERT!! That's 3 on the day for #${step.primary}! Throw the hats on the ice!!`;
            } else if (step.goalCount === 2) {
              styled += ` That's a pair on the day for #${step.primary}!`;
            } else if (step.goalCount >= 4) {
              styled += ` Incredible! That's goal #${step.goalCount} today for #${step.primary}! Unstoppable!!`;
            }

            if (isAnnouncer) {
              const clutch = isClutchGoal();
              const useHolyMackinaw = clutch && (Math.random() < 0.35);

              if (useHolyMackinaw) {
                if (sIdx === 0) {
                  let clean = styled.replace(/^and\s+/i, '');
                  styled = "HOLY MACKINAW!! " + clean.charAt(0).toUpperCase() + clean.slice(1);
                } else {
                  styled = styled.replace(/^and\s+/i, 'and HOLY MACKINAW, ');
                }
              } else if (sIdx === 0) {
                const intro = announcerIntros[Math.floor(Math.random() * announcerIntros.length)];
                const outro = announcerOutros[Math.floor(Math.random() * announcerOutros.length)];
                let clean = styled.replace(/^and\s+/i, '');
                styled = intro + clean.charAt(0).toUpperCase() + clean.slice(1) + outro;
              }
            }
          }

          // If same player as step 1, clean up repeated "and #7 " to "and "
          if (sIdx > 0 && isSame && step.primary) {
            styled = styled.replace(new RegExp('^and\\s+#' + step.primary + '\\s+', 'i'), 'and ');
          }

          if (sIdx === 0) {
            let prefix = '';
            if (currentTimeTag) {
              const per = document.getElementById('periodSelect').value;
              prefix = `[${currentTimeTag} ${per}] `;
            }
            step.text = prefix + styled.charAt(0).toUpperCase() + styled.slice(1);
          } else {
            step.text = styled;
          }
        });

        box.value = currentSteps.map(s => s.text).join(', ');
        autoResizeTextarea();
      } else {
        // Fallback for standalone single phrase
        if (!lastKey || !phrases[lastKey]) return;
        lastVarIndex = (lastVarIndex + 1) % phrases[lastKey].length;
        const newPhrase = getPhrase(lastKey, lastVarIndex);
        let styled = newPhrase;
        if (isAnnouncer && lastKey.startsWith('goal-')) {
          const intro = announcerIntros[Math.floor(Math.random() * announcerIntros.length)];
          const outro = announcerOutros[Math.floor(Math.random() * announcerOutros.length)];
          let clean = styled.replace(/^and\s+/i, '');
          styled = intro + clean.charAt(0).toUpperCase() + clean.slice(1) + outro;
        }
        let prefix = '';
        if (currentTimeTag) {
          const per = document.getElementById('periodSelect').value;
          prefix = `[${currentTimeTag} ${per}] `;
        }
        box.value = prefix + styled.charAt(0).toUpperCase() + styled.slice(1);
        autoResizeTextarea();
      }

      saveGameState();
    }

    // Period Status
    function periodStatus(type) {
      pushUndoState();
      const per = document.getElementById('periodSelect').value;
      const our = document.getElementById('ourTeam').value.trim() || 'Bulldogs';
      const opp = document.getElementById('oppTeam').value.trim() || 'Hawks';
      const sc = getScoreText();

      const gameType = document.getElementById('gameTypeSelect').value;
      const tourney = document.getElementById('tourneyNameInput').value.trim();
      let tourneyPrefix = '';
      if (tourney && gameType) {
        tourneyPrefix = `[${tourney} - ${gameType}] `;
      } else if (tourney) {
        tourneyPrefix = `[${tourney}] `;
      } else if (gameType) {
        tourneyPrefix = `[${gameType}] `;
      }

      const list = periodStatusPhrases[type];
      const idx = Math.floor(Math.random() * list.length);
      const text = tourneyPrefix + list[idx](per, our, opp, sc, ourScore, oppScore);

      currentSteps = [{
        key: type,
        isPeriodStatus: true,
        varIndex: idx,
        text: text
      }];

      document.getElementById('output').value = text;
      lastKey = null;
      autoResizeTextarea();
      saveGameState();
    }

    // Undo System
    function pushUndoState() {
      const snapshot = {
        ourScore,
        oppScore,
        playerGoals: JSON.parse(JSON.stringify(playerGoals)),
        output: document.getElementById('output').value,
        currentSteps: JSON.parse(JSON.stringify(currentSteps)),
        primaryPlayer,
        assistPlayer,
        lastKey,
        lastVarIndex
      };
      undoStack.push(snapshot);
      if (undoStack.length > 25) undoStack.shift();
    }

    function undoLastAction() {
      if (undoStack.length === 0) return;
      const prev = undoStack.pop();
      ourScore = prev.ourScore;
      oppScore = prev.oppScore;
      playerGoals = prev.playerGoals ? JSON.parse(JSON.stringify(prev.playerGoals)) : {};
      document.getElementById('ourScore').textContent = ourScore;
      document.getElementById('oppScore').textContent = oppScore;
      document.getElementById('output').value = prev.output;
      autoResizeTextarea();
      currentSteps = prev.currentSteps ? JSON.parse(JSON.stringify(prev.currentSteps)) : [];
      primaryPlayer = prev.primaryPlayer;
      assistPlayer = prev.assistPlayer;
      lastKey = prev.lastKey;
      lastVarIndex = prev.lastVarIndex;
      updatePlayerBadges();
      saveGameState();
    }

    // Sharing & Clipboard
    async function shareNative() {
      const txt = document.getElementById('output').value.trim();
      if (!txt) return;

      if (navigator.share) {
        try {
          await navigator.share({ text: txt });
        } catch (e) {
          // User cancelled or denied; fallback to clipboard
        }
      } else {
        copyText();
      }
    }

    async function copyText() {
      const box = document.getElementById('output');
      const txt = box.value.trim();
      if (!txt) return;

      try {
        if (navigator.clipboard) await navigator.clipboard.writeText(txt);
        else { box.select(); document.execCommand('copy'); }
        
        const b = document.getElementById('copyBtn');
        const orig = b.innerHTML;
        b.textContent = '✓ Copied!';
        b.style.background = '#16a34a';
        setTimeout(() => {
          b.innerHTML = orig;
          b.style.background = 'linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%)';
        }, 1500);
      } catch (e) {
        alert('Copied: ' + txt);
      }
    }

    // State Persistence (localStorage)
    function saveGameState() {
      const state = {
        ourTeam: document.getElementById('ourTeam').value,
        oppTeam: document.getElementById('oppTeam').value,
        ourScore,
        oppScore,
        period: document.getElementById('periodSelect').value,
        gameType: document.getElementById('gameTypeSelect').value,
        tourneyName: document.getElementById('tourneyNameInput').value,
        multiStep: document.getElementById('multiStepToggle').checked,
        announcer: document.getElementById('announcerToggle').checked,
        output: document.getElementById('output').value,
        currentSteps,
        playerGoals,
        primaryPlayer,
        assistPlayer
      };
      try {
        localStorage.setItem('hockey_gamestate_v2', JSON.stringify(state));
      } catch (e) {}
    }

    function loadGameState() {
      try {
        const raw = localStorage.getItem('hockey_gamestate_v2');
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.ourTeam) document.getElementById('ourTeam').value = s.ourTeam;
        if (s.oppTeam) document.getElementById('oppTeam').value = s.oppTeam;
        if (typeof s.ourScore === 'number') ourScore = s.ourScore;
        if (typeof s.oppScore === 'number') oppScore = s.oppScore;
        document.getElementById('ourScore').textContent = ourScore;
        document.getElementById('oppScore').textContent = oppScore;
        if (s.period) document.getElementById('periodSelect').value = s.period;
        if (s.gameType) document.getElementById('gameTypeSelect').value = s.gameType;
        if (s.tourneyName) document.getElementById('tourneyNameInput').value = s.tourneyName;
        if (typeof s.multiStep === 'boolean') document.getElementById('multiStepToggle').checked = s.multiStep;
        if (typeof s.announcer === 'boolean') document.getElementById('announcerToggle').checked = s.announcer;
        if (s.output) {
          document.getElementById('output').value = s.output;
          autoResizeTextarea();
        }
        if (Array.isArray(s.currentSteps)) currentSteps = s.currentSteps;
        if (s.playerGoals && typeof s.playerGoals === 'object') playerGoals = s.playerGoals;
        if (s.primaryPlayer) primaryPlayer = s.primaryPlayer;
        if (s.assistPlayer) assistPlayer = s.assistPlayer;
      } catch (e) {}
    }

    function resetNewGame() {
      if (!confirm('Start a new game? This will reset scores and text to 0-0.')) return;
      pushUndoState();
      ourScore = 0;
      oppScore = 0;
      playerGoals = {};
      primaryPlayer = null;
      assistPlayer = null;
      currentSteps = [];
      document.getElementById('ourScore').textContent = 0;
      document.getElementById('oppScore').textContent = 0;
      document.getElementById('periodSelect').value = '1st';
      document.getElementById('output').value = '';
      updatePlayerBadges();
      autoResizeTextarea();
      saveGameState();
    }
  </script>
</body>
